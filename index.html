<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>抽签转盘</title>
<meta name="description" content="输入名单，转一下，抽出结果。">
<meta name="theme-color" content="#f5eee3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 50a28 28 0 0 1 56 0z' fill='%232e221c'/%3E%3Cpath d='M10 50a22 22 0 0 1 44 0z' fill='%23f7d48c'/%3E%3Cpath d='M32 50 13 39a22 22 0 0 1 11-10z' fill='%23f3a083'/%3E%3Cpath d='M32 50 40 29a22 22 0 0 1 11 10z' fill='%23a2c5df'/%3E%3Cpath d='M32 50 40 20' stroke='%23e8553e' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='50' r='7' fill='%23e8553e'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5eee3;--bg2:#fffaf2;--ink:#2a1f1a;--muted:#8b7b6d;--line:#e6dbca;--card:#fffcf7;
  --accent:#e8553e;--on-accent:#fff;--rim:#2e221c;--bulb:#ffd36e;--win:#fff;
  --hub-bg:#e8553e;--hub-ink:#fff;--hub-ring:#2e221c;
  font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(130% 75% at 50% 80%,var(--bg2) 0%,var(--bg) 64%) fixed,var(--bg);transition:color .4s;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-x:hidden}
body[data-theme=night]::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.75;background-image:
  radial-gradient(1.6px 1.6px at 8% 14%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 22% 38%,#fff 50%,transparent 51%),
  radial-gradient(1.8px 1.8px at 36% 9%,#ffe9a8 50%,transparent 51%),radial-gradient(1.1px 1.1px at 47% 27%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 63% 12%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 74% 33%,#cfc6ff 50%,transparent 51%),
  radial-gradient(1.9px 1.9px at 88% 18%,#fff 50%,transparent 51%),radial-gradient(1.1px 1.1px at 94% 46%,#fff 50%,transparent 51%),
  radial-gradient(1.3px 1.3px at 4% 58%,#cfc6ff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 16% 82%,#fff 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 84% 76%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 96% 90%,#ffe9a8 50%,transparent 51%)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ===== 主界面 ===== */
.app{position:relative;max-width:1040px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px calc(20px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.brand svg{flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex:none}
.icon-btn{width:42px;height:42px;padding:0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;transition:transform .15s,border-color .2s,color .2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn:active{transform:scale(.92)}
.icon-btn:disabled{opacity:.35;pointer-events:none}

.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:3vh}
.hero{text-align:center;padding-top:clamp(14px,4vh,44px)}
@media (max-width:640px){
  .main .stage{width:calc(100% + 20px);margin-left:-10px;margin-right:-10px}
  .main{padding-bottom:8vh}
}
.kicker{display:inline-flex;align-items:center;gap:12px;color:var(--muted);font-size:clamp(13px,1.7vw,16px);letter-spacing:.38em;padding-left:.38em}
.kicker::before,.kicker::after{content:"";width:clamp(18px,4vw,36px);height:1px;background:currentColor;opacity:.55}
.result{min-height:1.3em;margin-top:6px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.18em .32em;font-size:clamp(40px,8.6vw,92px);font-weight:800;line-height:1.18;letter-spacing:.02em;color:var(--accent);overflow-wrap:anywhere}
.result .ph{color:var(--muted);opacity:.45;font-weight:600}
.result .live{color:var(--ink);opacity:.42;display:inline-block}
.result .name{display:inline-block;position:relative}
.result .name.land{animation:land .7s cubic-bezier(.18,1.35,.32,1) both}
.result .name.land::after{content:"";position:absolute;left:8%;right:8%;bottom:-.04em;height:.09em;border-radius:1em;background:var(--accent);opacity:.28;transform-origin:left;animation:swash .5s .35s ease-out both}
.result.multi{font-size:clamp(22px,4.6vw,42px);gap:10px;padding:0 4px}
.result .tag{display:inline-block;padding:.14em .62em;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.result .tag.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.result .tag.live{background:transparent;color:var(--ink);opacity:.45;border:2px dashed var(--line)}
@keyframes land{0%{transform:scale(1.7);opacity:0;filter:blur(10px)}55%{opacity:1;filter:blur(0)}100%{transform:none}}
@keyframes swash{from{transform:scaleX(0)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}

.stage{position:relative;width:min(100%,max(300px,min(960px,calc((100vh - 330px) * 1.786))));margin:clamp(10px,3vh,30px) auto 0}
#dial{display:block;width:100%;height:auto;overflow:visible;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#dial text{pointer-events:none}
#dial .sec{transition:opacity .4s,transform .55s cubic-bezier(.2,1.5,.35,1)}
#dial .veil{opacity:0;transition:opacity .45s;pointer-events:none}
#dial.landed .veil{opacity:.62}
#dial .sec.win>path{stroke:var(--win);stroke-width:7px}
#dial .sec text{opacity:var(--lab,1)}
#dial .fadein{animation:fadein .45s ease-out both}
@keyframes fadein{from{opacity:0}}
#cur{transition:opacity .2s}
#dial:not(.spinning) #cur{opacity:0}
#bulbs .on{animation:twinkle 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * -.31s)}
#bulbs[data-mode=chase] .on{animation:chase .39s steps(1,end) infinite;animation-delay:calc(var(--k) * -.13s)}
#bulbs[data-mode=win] .on{animation:flash .26s steps(1,end) 9 both}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes chase{0%{opacity:1}33.3%,100%{opacity:.1}}
@keyframes flash{0%{opacity:1}50%{opacity:.08}}

.hub{position:absolute;left:50%;top:91.07%;width:17%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.5),rgba(255,255,255,0) 46%),var(--hub-bg);color:var(--hub-ink);
  box-shadow:0 0 0 clamp(4px,.7vw,7px) var(--hub-ring),0 14px 30px -8px rgba(0,0,0,.45),inset 0 -7px 14px rgba(0,0,0,.18);
  font-size:clamp(15px,2.6vw,27px);font-weight:800;letter-spacing:.14em;text-indent:.14em;transition:transform .18s cubic-bezier(.3,1.6,.5,1),filter .2s}
.hub::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--hub-bg);animation:ripple 2.4s ease-out infinite;pointer-events:none}
.hub:hover{filter:brightness(1.06)}
.hub:active{transform:translate(-50%,-50%) scale(.92)}
.hub:disabled{cursor:default}
.hub:disabled::before{display:none}
.hub .dots{display:inline-flex;gap:.18em}
.hub .dots i{width:.24em;height:.24em;border-radius:50%;background:currentColor;animation:dot 1s ease-in-out infinite}
.hub .dots i:nth-child(2){animation-delay:.15s}.hub .dots i:nth-child(3){animation-delay:.3s}
@keyframes ripple{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(1.55);opacity:0}}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-.25em);opacity:1}}

.below{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:clamp(28px,5.5vw,56px)}
.status{color:var(--muted);font-size:14px;text-align:center}
.link{border:0;background:none;padding:0 2px;color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.recent{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:720px}
.recent span{padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--ink);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent span:first-child{border-color:var(--accent);color:var(--accent)}

/* ===== 设置抽屉 ===== */
.drawer{position:fixed;inset:0;z-index:30;visibility:hidden;transition:visibility 0s .4s}
.drawer.open{visibility:visible;transition:none}
.scrim{position:absolute;inset:0;background:rgba(18,12,8,.3);opacity:0;transition:opacity .35s}
.drawer.open .scrim{opacity:1}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(450px,100%);display:flex;flex-direction:column;background:var(--card);color:var(--ink);box-shadow:-24px 0 60px -24px rgba(0,0,0,.4);transform:translateX(104%);transition:transform .42s cubic-bezier(.2,.9,.2,1)}
.drawer.open .panel{transform:none}
@media (max-width:640px){
  .panel{top:auto;left:0;width:100%;height:92vh;border-radius:24px 24px 0 0;transform:translateY(104%)}
  .panel::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
}
.p-head{display:flex;align-items:center;gap:8px;padding:18px 16px 0 20px}
.tabs{flex:1;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--line)}
.tabs button{flex:1;height:36px;border:0;border-radius:10px;background:transparent;font-size:14.5px;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 2px 8px -3px rgba(0,0,0,.25)}
.p-body{flex:1;overflow-y:auto;padding:6px 20px 40px;-webkit-overflow-scrolling:touch}
.pane{animation:paneIn .3s ease-out}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}
.grp{margin-top:18px;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:9px;padding:15px 0;border-bottom:1px solid var(--line)}
.row.inline{flex-direction:row;align-items:center;justify-content:space-between}
.lbl{font-size:14.5px;font-weight:600}
.hint{margin:0;color:var(--muted);font-size:12.5px;line-height:1.65}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:36px;padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;background:transparent;font-size:14px;transition:border-color .2s,background .2s,color .2s}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600}
.rng{display:flex;align-items:center;gap:14px}
.rng input{flex:1;min-width:0;accent-color:var(--accent)}
.rng output{flex:none;min-width:48px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;margin:0;border-radius:14px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
.txt{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:transparent;font-size:16px}
.txt:focus,textarea:focus{outline:none;border-color:var(--accent)}
.stepper{display:inline-flex;align-items:center;width:max-content;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:42px;height:40px;border:0;background:transparent;font-size:19px}
.stepper button:active{background:var(--line)}
.stepper input{width:56px;height:40px;border:0;background:transparent;text-align:center;font-size:16px;font-weight:600;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.cards.two{grid-template-columns:1fr 1fr}
.card-opt{position:relative;padding:6px 6px 8px;border:1.5px solid var(--line);border-radius:14px;background:transparent;text-align:center;font-size:13.5px;transition:border-color .2s,transform .15s}
.card-opt svg{display:block;width:100%;height:auto;border-radius:9px;margin-bottom:6px}
.card-opt:active{transform:scale(.97)}
.card-opt[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);font-weight:700}
.card-opt small{display:block;margin-top:2px;color:var(--muted);font-size:11.5px;font-weight:400}
textarea{display:block;width:100%;min-height:230px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:transparent;font-size:16px;line-height:1.65;resize:vertical}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px}
.list-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.list-meta .count{color:var(--muted);font-size:13.5px}
.chip{padding:6px 13px;border:1.5px solid var(--line);border-radius:999px;background:transparent;font-size:13.5px;transition:border-color .2s,color .2s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.gen input{width:68px;padding:6px 8px;border:1.5px solid var(--line);border-radius:9px;background:transparent;text-align:center;font-size:15px}
.probs{display:flex;flex-wrap:wrap;gap:6px}
.probs span{padding:3px 9px;border-radius:7px;border:1px solid var(--line);font-size:12.5px}
.probs b{margin-left:4px;color:var(--accent)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.5}
.hist li span{overflow-wrap:anywhere}
.hist time{flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.empty{padding:40px 0;color:var(--muted);text-align:center;font-size:14px}

/* ===== 结果弹窗 ===== */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(18,12,8,.38);animation:fadein .25s}
.box{position:relative;width:min(100%,430px);padding:34px 26px 24px;border-radius:26px;background:var(--card);color:var(--ink);text-align:center;box-shadow:0 30px 80px -24px rgba(0,0,0,.5);animation:boxIn .5s cubic-bezier(.2,1.4,.35,1) both}
.box::before{content:"";position:absolute;left:24px;right:24px;top:0;height:6px;border-radius:0 0 6px 6px;background:var(--accent)}
@keyframes boxIn{from{transform:translateY(30px) scale(.86);opacity:0}}
.box .k{color:var(--muted);font-size:14px;letter-spacing:.3em;padding-left:.3em}
.box .names{margin:12px 0 26px;color:var(--accent);font-size:clamp(30px,9vw,48px);font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.box .names.many{font-size:clamp(20px,5.6vw,28px)}
.m-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.m-actions button{min-width:104px;height:46px;padding:0 18px;border-radius:23px;font-size:15px;font-weight:600}
.btn{border:0;background:var(--accent);color:var(--on-accent)}
.btn-ghost{border:1.5px solid var(--line);background:transparent}
#fx{position:fixed;inset:0;z-index:50;width:100%;height:100%;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  #bulbs .on,.hub::before{animation:none!important}
}
</style>
</head>
<body data-theme="cream">

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M4 50a28 28 0 0 1 56 0z" fill="var(--rim)"/><path d="M10 50a22 22 0 0 1 44 0z" fill="var(--bulb)"/><path d="M32 50 40 22" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="50" r="7" fill="var(--accent)"/></svg>
      <span id="titleText"></span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="histBtn" aria-label="抽签记录" title="抽签记录">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="icon-btn" id="gearBtn" aria-label="设置" title="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
  <section class="hero">
    <div class="kicker">你抽中的是</div>
    <div class="result" id="res" aria-live="polite"></div>
  </section>

  <section class="stage" id="stage">
    <svg id="dial" viewBox="0 0 1000 560" aria-hidden="true">
      <defs>
        <clipPath id="clipUpper"><rect x="-40" y="-40" width="1080" height="550"/></clipPath>
        <radialGradient id="gVig" gradientUnits="userSpaceOnUse" cx="500" cy="510" r="430">
          <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".14"/>
        </radialGradient>
        <linearGradient id="gTop" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="510">
          <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="gHalo"><stop offset="0" style="stop-color:var(--bulb)" stop-opacity=".8"/><stop offset="1" style="stop-color:var(--bulb)" stop-opacity="0"/></radialGradient>
        <filter id="fDrop" x="-10%" y="-15%" width="120%" height="135%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".24"/></filter>
        <filter id="fSoft" x="-60%" y="-20%" width="220%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".3"/></filter>
        <g id="arcDefs"></g>
      </defs>
      <g id="gBack"></g>
      <g clip-path="url(#clipUpper)"><g id="gWheel"><g id="gSecs"></g><path id="cur"/></g></g>
      <g id="gOver"></g>
      <g id="bulbs" data-mode="idle"></g>
      <g id="gGhosts"></g>
      <g id="gNeedle"></g>
      <g id="gFlap"></g>
      <g id="gBase"></g>
    </svg>
    <button class="hub" id="hub" aria-label="开始抽签">开始</button>
  </section>

  <footer class="below">
    <div class="status"><span id="statusText"></span> <button class="link" id="resetBtn" hidden>重置</button></div>
    <div class="recent" id="recent"></div>
  </footer>
  </main>
</div>

<div class="drawer" id="drawer" inert>
  <div class="scrim" id="scrim"></div>
  <aside class="panel" role="dialog" aria-modal="true" aria-label="设置">
    <div class="p-head">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="list">名单</button>
        <button role="tab" data-tab="draw">抽法</button>
        <button role="tab" data-tab="look">外观</button>
        <button role="tab" data-tab="history">记录</button>
      </div>
      <button class="icon-btn" id="closeBtn" aria-label="关闭" title="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="p-body" id="pBody">
      <div class="pane" data-pane="list">
        <div class="row">
          <label class="lbl" for="titleInp">转盘名字</label>
          <input class="txt" id="titleInp" maxlength="24" placeholder="比如：今天吃什么">
        </div>
        <div class="row">
          <label class="lbl" for="listTA">参与抽选的名单</label>
          <textarea id="listTA" spellcheck="false" placeholder="一行一个，比如：&#10;小明&#10;小红&#10;小刚"></textarea>
          <div class="list-meta">
            <span class="count" id="listCount"></span>
            <span class="tools"><button class="chip" id="shuffleBtn">打乱顺序</button><button class="chip" id="dedupeBtn">去掉重复</button></span>
          </div>
        </div>
        <div class="row">

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);

const THEMES = {
  cream: { name: '奶油', bg: '#f5eee3', bg2: '#fffaf2', ink: '#2a1f1a', muted: '#8b7b6d', line: '#e6dbca', card: '#fffcf7',

const THEME_ORDER = ['cream', 'night', 'candy', 'mono', 'sketch'];

const DEF = {

  list: '火锅\n烧烤\n日料\n披萨\n麻辣烫\n轻食沙拉\n螺蛳粉\n饺子',
  count: 1, multi: 'each', after: 'keep', rng: 'equal', stopAt: 'random',

};
const isWheel = () => cfg.spinner === 'wheel';
const FIELDS = [
  { tab: 'draw', key: 'count', type: 'stepper', label: '每次抽几个', min: 1, max: 99 },
  { tab: 'draw', key: 'multi', type: 'seg', label: '抽多个时', opts: [['each', '一个一个转'], ['once', '转一次全出']], show: () => cfg.count > 1 },
  { tab: 'draw', key: 'after', type: 'seg', label: '抽中后', opts: [['keep', '放回，还能再中'], ['remove', '移出转盘'], ['gray', '留着但置灰']] },
  { tab: 'draw', key: 'rng', type: 'seg', label: '抽中概率', opts: [['equal', '人人相同'], ['weight', '按权重'], ['bag', '洗牌轮转']], hint: rngHint },
  { tab: 'draw', key: 'stopAt', type: 'seg', label: '指针停在扇区的', opts: [['random', '随机位置'], ['center', '正中间']],

  { tab: 'look', key: 'theme', type: 'themes', label: '主题' },
  { tab: 'look', key: 'spinner', type: 'spinner', label: '转动方式' },
  { tab: 'look', key: 'duration', type: 'range', label: '转动时长', min: 1, max: 15, step: 0.5, unit: () => ' 秒', group: '动画' },
  { tab: 'look', key: 'turns', type: 'range', label: () => isWheel() ? '转几圈' : '来回摆几次', min: 1, max: 20, step: 1, unit: () => isWheel() ? ' 圈' : ' 次' },
  { tab: 'look', key: 'easing', type: 'seg', label: '停下方式', opts: [['smooth', '平稳减速'], ['suspense', '慢慢挪到'], ['bounce', '冲过头再回弹'], ['accel', '先加速再减速']] },
  { tab: 'look', key: 'labels', type: 'switch', label: '转盘上显示文字', group: '细节' },
  { tab: 'look', key: 'lights', type: 'switch', label: '跑马灯', show: () => !THEMES[cfg.theme].lineArt },
  { tab: 'look', key: 'confetti', type: 'switch', label: '抽中撒彩带' },
  { tab: 'look', key: 'sound', type: 'switch', label: '音效' },
  { tab: 'look', key: 'popup', type: 'switch', label: '抽中后弹出结果卡片' }
];
const FIELD = {};
FIELDS.forEach(f => { FIELD[f.key] = f; });

function rngHint() {
  if (cfg.rng === 'weight') return '在名单里写成「名字 | 3」设置权重，权重越大扇区越大、越容易中；不写默认是 1。';
  if (cfg.rng === 'bag') return cfg.after === 'keep'
    ? '像洗牌发牌：一轮里每一项都会被抽到一次，全部轮过才重新洗牌。'
    : '只在「抽中后：放回」时起作用，现在和「人人相同」一样。';
  return '';
}

let cfg = Object.assign({}, DEF);
const run = { sig: '', drawn: [], bag: [], history: [], last: [] };
let items = [], layout = [];
const highlight = new Set();
const st = { ph: 0, wr: 0 };
let spinning = false, relayTimer = 0, idleTimer = 0, modalPicked = [];

/* ---------- 存取 ---------- */
function valid(k, v) {
  const f = FIELD[k];
  if (typeof v !== typeof DEF[k]) return false;
  if (f && f.opts) return f.opts.some(o => o[0] === v);
  if (f && (f.type === 'range' || f.type === 'stepper')) return v >= f.min && v <= f.max;
  if (k === 'theme') return v in THEMES;
  if (k === 'spinner') return v === 'pointer' || v === 'wheel';
  return true;
}
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { d = null; }
  if (!d) {
    try { const o = JSON.parse(localStorage.getItem(OLD_KEY)); if (o && o.cfg && typeof o.cfg.list === 'string') cfg.list = o.cfg.list; } catch (e) { /* 旧版数据读不出就用默认 */ }
    return;
  }
  const c = d.cfg || {}, r = d.run || {};
  for (const k in DEF) if (k in c && valid(k, c[k])) cfg[k] = c[k];
  const ints = a => Array.isArray(a) ? a.filter(Number.isInteger) : [];
  run.sig = typeof r.sig === 'string' ? r.sig : '';
  run.drawn = ints(r.drawn);
  run.bag = ints(r.bag);
  run.history = Array.isArray(r.history) ? r.history.filter(x => x && Array.isArray(x.names)).slice(0, 200) : [];
  run.last = Array.isArray(r.last) ? r.last.map(String) : [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ cfg, run })); } catch (e) { /* 无痕模式存不了 */ }
}

/* ---------- 名单 ---------- */
function parse() {
  items = [];
  cfg.list.split(/\r?\n/).forEach(line => {
    let name = line.trim(), w = 1;
    if (!name) return;
    const m = name.match(/^(.*?)\s*[|｜]\s*(\d+(?:\.\d+)?)$/);
    if (m && m[1]) { name = m[1]; w = parseFloat(m[2]) || 1; }
    items.push({ id: items.length, name, w });
  });
  const sig = items.map(i => i.name + '\u0001' + i.w).join('\n');
  if (sig !== run.sig) { run.sig = sig; run.drawn = []; run.bag = []; }
}
const listText = arr => arr.map(i => i.w !== 1 ? `${i.name} | ${i.w}` : i.name).join('\n');
const drawnSet = () => new Set(run.drawn);
function visible() { const d = drawnSet(); return cfg.after === 'remove' ? items.filter(i => !d.has(i.id)) : items; }
function pool() { const d = drawnSet(); return cfg.after === 'keep' ? items : items.filter(i => !d.has(i.id)); }
function computeLayout() {
  const vis = visible();
  layout = [];
  if (!vis.length) return;
  const ws = vis.map(i => cfg.rng === 'weight' ? i.w : 1);
  const tot = ws.reduce((a, b) => a + b, 0);
  for (let c = 0; c < (isWheel() ? 2 : 1); c++) {
    let a = -90 + 180 * c;
    vis.forEach((it, k) => { const s = { it, k, c, a0: a, a1: a + 180 * ws[k] / tot }; a = s.a1; layout.push(s); });
    layout[layout.length - 1].a1 = 90 + 180 * c;
  }
}

/* ---------- 随机 ---------- */
const cr = window.crypto && window.crypto.getRandomValues ? window.crypto : null;
function rand() {
  if (!cr) return Math.random();
  const a = new Uint32Array(1); cr.getRandomValues(a); return a[0] / 4294967296;
}
function randInt(n) {
  if (!cr) return Math.floor(Math.random() * n);
  const lim = Math.floor(4294967296 / n) * n, a = new Uint32Array(1);
  do cr.getRandomValues(a); while (a[0] >= lim);
  return a[0] % n;
}
function pickOne(ex) {
  const p = pool().filter(i => !ex.has(i.id));
  if (!p.length) return null;
  if (cfg.rng === 'weight') {
    const tot = p.reduce((s, i) => s + i.w, 0);
    let r = rand() * tot;
    for (const i of p) { r -= i.w; if (r < 0) return i; }
    return p[p.length - 1];
  }
  if (cfg.rng === 'bag' && cfg.after === 'keep') {
    const ok = new Set(p.map(i => i.id));
    let cand = run.bag.filter(id => ok.has(id));
    if (!cand.length) { run.bag = items.map(i => i.id); cand = run.bag.filter(id => ok.has(id)); }
    const id = cand[randInt(cand.length)];
    run.bag = run.bag.filter(x => x !== id);
    return items[id];
  }
  return p[randInt(p.length)];
}

/* ---------- 几何 ---------- */
const f2 = n => Math.round(n * 100) / 100;
const mod = (a, m) => ((a % m) + m) % m;
function pt(r, a) { const t = a * Math.PI / 180; return [f2(CX + r * Math.sin(t)), f2(CY - r * Math.cos(t))]; }
function sectorD(r, a0, a1) {
  const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1);
  return `M${CX} ${CY}L${x0} ${y0}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}Z`;
}
function arcD(r, a0, a1) {
  const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1);
  return `M${x0} ${y0}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
}
const halfDisc = r => `M${CX - r} ${CY}A${r} ${r} 0 0 1 ${CX + r} ${CY}Z`;
const halfRing = (r1, r2) => `M${CX - r2} ${CY}A${r2} ${r2} 0 0 1 ${CX + r2} ${CY}L${CX + r1} ${CY}A${r1} ${r1} 0 0 0 ${CX - r1} ${CY}Z`;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const cw = ch => /[ᄀ-￿]/.test(ch) ? 1 : 0.6;
function textEm(s) { let w = 0; for (const ch of s) w += cw(ch); return w; }
function cut(s, maxEm) {
  let w = 0, out = '';
  for (const ch of s) { const c = cw(ch); if (w + c > maxEm - 0.8) return out + '…'; w += c; out += ch; }
  return out;
}

/* ---------- 画转盘 ---------- */
const dial = $('dial'), gBack = $('gBack'), gWheel = $('gWheel'), gSecs = $('gSecs'), cur = $('cur'), gOver = $('gOver'),
  gBulbs = $('bulbs'), gGhosts = $('gGhosts'), gNeedle = $('gNeedle'), gFlap = $('gFlap'), gBase = $('gBase'), arcDefs = $('arcDefs');
let needleRot = null, needleSway = null, flapRot = null, ghosts = [];

function renderFrame() {
  const t = THEMES[cfg.theme];
  [gBack, gOver, gBulbs, gNeedle, gGhosts, gFlap, gBase].forEach(g => { g.textContent = ''; });
  if (t.lineArt) {
    el('path', { d: arcD(R, -90, 90), fill: 'none', stroke: t.rim, 'stroke-width': 6, 'stroke-linecap': 'round' }, gOver);
    el('path', { d: halfDisc(PLATE), fill: t.plate, stroke: t.plateRing, 'stroke-width': 4 }, gOver);
    el('line', { x1: CX - R - 30, y1: CY, x2: CX + R + 30, y2: CY, stroke: t.rim, 'stroke-width': 6, 'stroke-linecap': 'round' }, gBase);
  } else {
    el('path', { d: halfDisc(RO), fill: t.rim, filter: 'url(#fDrop)' }, gBack);
    el('path', { d: halfDisc(R), fill: 'url(#gVig)' }, gOver);
    el('path', { d: halfDisc(R), fill: 'url(#gTop)' }, gOver);
    el('path', { d: arcD(R + 1.5, -90, 90), fill: 'none', stroke: t.rimLo, 'stroke-width': 3 }, gOver);
    el('path', { d: arcD(RO - 3, -90, 90), fill: 'none', stroke: t.rimHi, 'stroke-width': 2, opacity: 0.9 }, gOver);
    el('path', { d: halfDisc(PLATE + 14), fill: t.rim, opacity: 0.16 }, gOver);
    el('path', { d: halfDisc(PLATE), fill: t.plate, stroke: t.plateRing, 'stroke-width': 5 }, gOver);
    el('rect', { x: CX - RO - 18, y: CY - 6, width: 2 * RO + 36, height: 44, rx: 16, fill: t.rim, filter: 'url(#fDrop)' }, gBase);
    el('rect', { x: CX - RO - 10, y: CY - 3, width: 2 * RO + 20, height: 2.5, rx: 1.2, fill: t.rimHi, opacity: 0.8 }, gBase);
    if (cfg.lights) {
      const n = 17;
      for (let i = 0; i < n; i++) {
        const [x, y] = pt(RB, -84 + 168 * i / (n - 1));
        const b = el('g', { class: 'bulb', transform: `translate(${x} ${y})`, style: `--i:${i};--k:${2 - (i % 3)}` }, gBulbs);
        el('circle', { r: 7.5, fill: t.bulbOff }, b);
        const on = el('g', { class: 'on' }, b);
        el('circle', { r: 21, fill: 'url(#gHalo)' }, on);
        el('circle', { r: 7.5, fill: t.bulb }, on);
        el('circle', { r: 2.6, cx: -2.2, cy: -2.4, fill: '#fff', opacity: 0.85 }, on);
      }
    }
  }
  ghosts = []; needleRot = needleSway = flapRot = null;
  gGhosts.style.display = spinning ? '' : 'none';
  if (!isWheel()) {
    const L = R * 0.64;
    const shape = (parent, fill) => {
      el('path', { d: `M-12 0L-4.5 ${-L + 58}L4.5 ${-L + 58}L12 0Z`, fill, stroke: fill, 'stroke-width': 3, 'stroke-linejoin': 'round' }, parent);
      el('path', { d: `M0 ${-L}L-21 ${-L + 54}L21 ${-L + 54}Z`, fill, stroke: fill, 'stroke-width': 10, 'stroke-linejoin': 'round' }, parent);
    };
    for (let i = 0; i < 4; i++) {
      const g = el('g', { opacity: [0.2, 0.13, 0.08, 0.04][i] }, gGhosts);
      shape(g, t.needle); ghosts.push(g);
    }
    needleRot = el('g', {}, gNeedle);
    needleSway = el('g', { filter: t.lineArt ? '' : 'url(#fSoft)' }, needleRot);
    shape(needleSway, t.needle);
    if (!t.lineArt) el('path', { d: `M0 -20L0 ${-L + 66}`, stroke: t.needleHi, 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0.7 }, needleSway);
  } else {
    flapRot = el('g', {}, gFlap);
    const fg = el('g', { filter: t.lineArt ? '' : 'url(#fSoft)' }, flapRot);
    el('path', { d: 'M-24 0L24 0L0 86Z', fill: t.accent, stroke: t.lineArt ? t.accent : '#fff', 'stroke-width': 5, 'stroke-linejoin': 'round' }, fg);
    el('circle', { r: 11, fill: t.lineArt ? '#fff' : t.rim, stroke: t.accent, 'stroke-width': 5 }, fg);
  }
  setSway(!spinning);
  applyPose();
}

function colorOf(s, n) {
  const t = THEMES[cfg.theme], len = t.secs.length;
  if (isWheel() && n > 1 && n % len === 1 && s.k === n - 1 && !t.lineArt) return [t.fix, t.fixLabel];
  return [t.secs[s.k % len], t.labels[(s.k % len) % t.labels.length]];
}

function labelPlan() {
  if (!cfg.labels || !layout.length) return { mode: 'none' };
  const scale = Math.max(0.25, (dial.getBoundingClientRect().width || 600) / 1000);
  const fsMin = 12 / scale, fsMax = Math.min(46, 27 / scale);
  const rIn = PLATE + 26, rOut = R - 20;
  const secs = layout.filter(s => s.c === 0);
  const rT = R * 0.8;
  let fsA = fsMax;
  secs.forEach(s => { fsA = Math.min(fsA, rT * (s.a1 - s.a0) * Math.PI / 180 * 0.82 / Math.max(textEm(s.it.name), 1.4)); });
  fsA = Math.min(fsA, (rOut - rIn) * 0.3);
  if (fsA >= Math.max(fsMin * 1.1, 18)) return { mode: 'arc', fs: fsA, r: rT };
  const k = Math.min(...secs.map(s => s.a1 - s.a0)) * Math.PI / 180;
  const fs = Math.min(fsMax * 0.9, k * R * 0.82 * 0.6);
  if (fs < 9 / scale) return { mode: 'none' };
  return { mode: 'radial', fs, rIn, rOut };
}

function renderSectors(fade) {
  gSecs.textContent = ''; arcDefs.textContent = '';
  dial.classList.remove('landed');
  const t = THEMES[cfg.theme];
  if (!layout.length) {
    el('path', { d: arcD(R - 40, -90, 90), fill: 'none', stroke: t.muted, 'stroke-width': 3, 'stroke-dasharray': '2 14', 'stroke-linecap': 'round', opacity: 0.6 }, gSecs);
    el('text', { x: CX, y: CY - 190, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 700, fill: t.muted }, gSecs).textContent =
      items.length ? '全部抽完了' : '名单还是空的';
    return;
  }
  const n = layout.length / (isWheel() ? 2 : 1), drawn = drawnSet(), gray = cfg.after === 'gray';
  const plan = labelPlan();
  if (fade) gSecs.classList.add('fadein'); else gSecs.classList.remove('fadein');
  layout.forEach((s, idx) => {
    const g = el('g', { class: 'sec' }, gSecs);
    s.g = g;
    let [fill, lab] = colorOf(s, n);

function confetti() {

  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cv.hidden = false;
  const t = THEMES[cfg.theme];
  const cols = t.secs.filter(c => c !== 'transparent').concat([t.accent, t.bulb, t.accent]);
  const hub = $('hub').getBoundingClientRect();
  const ps = [];
  const shoot = (x, y, ang, spread, sp, count) => {
    for (let i = 0; i < count; i++) {
      const a = (ang + (Math.random() - 0.5) * spread) * Math.PI / 180, v = sp * (0.55 + Math.random() * 0.6);
      const kind = Math.random();
      ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 9,
        flip: Math.random() * 6.3, vf: 6 + Math.random() * 8, wob: Math.random() * 6.3,
        kind: kind < 0.55 ? 0 : kind < 0.8 ? 1 : 2, s: 5 + Math.random() * 5, c: cols[Math.floor(Math.random() * cols.length)] });
    }
  };
  const sp = Math.max(900, H * 1.45);

  shoot(W, H * 0.95, -118, 26, sp, 70);
  shoot(hub.left + hub.width / 2, hub.top, -90, 70, sp * 0.62, 50);

      p.wob += dt * 5; p.x += (p.vx + Math.sin(p.wob) * 40) * dt; p.y += p.vy * dt;
      p.r += p.vr * dt; p.flip += p.vf * dt;

  };

  if (mode === 'wheel') {
    s += `<path d="M${c - 5} 6L${c + 5} 6L${c} 19Z" fill="${t.accent}"/>`;
    s += `<path d="M${c + 30} ${y - 46}A55 55 0 0 1 ${c + 50} ${y - 22}" fill="none" stroke="${t.accent}" stroke-width="2.5" stroke-linecap="round"/><path d="M${c + 50} ${y - 22}l-6 -1.5 4 -4.5z" fill="${t.accent}"/>`;
  } else {
    const [nx, ny] = P(34, 24);
    s += `<path d="M${c} ${y}L${nx} ${ny}" stroke="${t.needle}" stroke-width="3.2" stroke-linecap="round"/>`;
    if (mode === 'pointer') s += `<path d="M${c - 22} ${y - 40}A40 40 0 0 1 ${c + 22} ${y - 40}" fill="none" stroke="${t.accent}" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 5"/>`;
  }
  s += `<circle cx="${c}" cy="${y}" r="7" fill="${t.hub[0]}" stroke="${t.hub[2]}" stroke-width="2"/>`;
  if (!t.lineArt) s += `<rect x="${c - r2 - 4}" y="${y - 1}" width="${2 * r2 + 8}" height="9" rx="3" fill="${t.rim}"/>`;
  return s + '</svg>';
}

function buildSettings() {
  FIELDS.forEach(f => {
    const pane = document.querySelector(`[data-pane="${f.tab}"]`);
    if (f.group) pane.append(h('div', { class: 'grp' }, f.group));
    const id = 'f-' + f.key;
    const inline = f.type === 'switch' || f.type === 'stepper';
    const row = h('div', { class: 'row' + (inline ? ' inline' : '') });
    const r = refs[f.key] = { row };
    r.lbl = h(f.type === 'switch' || f.type === 'range' ? 'label' : 'div', { class: 'lbl' });
    if (r.lbl.tagName === 'LABEL') r.lbl.htmlFor = id;
    let ctl;
    if (f.type === 'seg') {
      ctl = h('div', { class: 'seg', role: 'group' });
      f.opts.forEach(([v, t]) => { const b = h('button', { type: 'button', 'data-v': v }, t); b.onclick = () => set(f.key, v); ctl.append(b); });
    } else if (f.type === 'switch') {
      r.inp = ctl = h('input', { type: 'checkbox', class: 'sw', id });
      r.inp.onchange = () => set(f.key, r.inp.checked);
    } else if (f.type === 'range') {
      r.inp = h('input', { type: 'range', id, min: f.min, max: f.max, step: f.step });
      r.out = h('output', {});
      r.inp.oninput = () => set(f.key, parseFloat(r.inp.value));
      ctl = h('div', { class: 'rng' }, r.inp, r.out);
    } else if (f.type === 'stepper') {
      const minus = h('button', { type: 'button', 'aria-label': '减一' }, '−'), plus = h('button', { type: 'button', 'aria-label': '加一' }, '+');
      r.inp = h('input', { type: 'number', inputmode: 'numeric', min: f.min, max: f.max, 'aria-label': val(f.label) });
      const put = v => { set(f.key, Math.min(f.max, Math.max(f.min, Math.round(v) || f.min))); r.inp.value = cfg[f.key]; };
      minus.onclick = () => put(cfg[f.key] - 1);
      plus.onclick = () => put(cfg[f.key] + 1);
      r.inp.onchange = () => put(parseFloat(r.inp.value));
      ctl = h('div', { class: 'stepper' }, minus, r.inp, plus);
    } else if (f.type === 'themes') {
      ctl = h('div', { class: 'cards' });
      r.cards = THEME_ORDER.map(k => {
        const b = h('button', { type: 'button', class: 'card-opt', 'data-v': k });
        b.innerHTML = miniDial(THEMES[k], 'theme');
        b.append(THEMES[k].name);
        b.onclick = () => set('theme', k);
        ctl.append(b); return b;
      });
    } else if (f.type === 'spinner') {
      ctl = h('div', { class: 'cards two' });
      r.cards = [['pointer', '指针摆动', '转盘不动，指针来回摆'], ['wheel', '转盘旋转', '指针不动，转盘转圈']].map(([v, name, sub]) => {
        const b = h('button', { type: 'button', class: 'card-opt', 'data-v': v });
        b.dataset.name = name; b.dataset.sub = sub;
        b.onclick = () => set('spinner', v);
        ctl.append(b); return b;
      });
    }
    row.append(r.lbl, ctl);
    if (f.hint) { r.hint = h('p', { class: 'hint' }); row.append(r.hint); }
    pane.append(row);
  });
}
function syncSettings() {
  FIELDS.forEach(f => {
    const r = refs[f.key], v = cfg[f.key];
    r.row.hidden = f.show ? !f.show() : false;
    r.lbl.textContent = val(f.label);
    if (f.type === 'seg') r.row.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    else if (f.type === 'switch') r.inp.checked = v;
    else if (f.type === 'range') { r.inp.value = v; r.out.textContent = v + val(f.unit); }
    else if (f.type === 'stepper') { if (document.activeElement !== r.inp) r.inp.value = v; }
    else if (f.type === 'themes') r.cards.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    else if (f.type === 'spinner') r.cards.forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.v === v));
      b.innerHTML = miniDial(THEMES[cfg.theme], b.dataset.v);
      b.append(b.dataset.name, h('small', {}, b.dataset.sub));
    });
    if (r.hint) { r.hint.textContent = f.hint(); r.hint.hidden = !r.hint.textContent; }
  });
  updateListMeta();
}
function updateListMeta() {
  $('listCount').textContent = `${items.length} 项`;
  const show = cfg.rng === 'weight' && items.length > 0;
  $('probRow').hidden = !show;
  if (!show) return;
  const box = $('probs'), tot = items.reduce((s, i) => s + i.w, 0);
  box.textContent = '';
  items.slice(0, 60).forEach(i => {
    const pct = i.w / tot * 100;
    box.append(h('span', {}, i.name, h('b', {}, (pct >= 10 ? pct.toFixed(0) : pct.toFixed(1)) + '%')));
  });
  if (items.length > 60) box.append(h('span', {}, `…共 ${items.length} 项`));
}
function applyTheme() {
  const t = THEMES[cfg.theme], s = document.documentElement.style;
  const vars = { '--bg': t.bg, '--bg2': t.bg2, '--ink': t.ink, '--muted': t.muted, '--line': t.line, '--card': t.card,
    '--accent': t.accent, '--on-accent': t.onAccent, '--rim': t.rim, '--bulb': t.bulb, '--win': t.win,
    '--hub-bg': t.hub[0], '--hub-ink': t.hub[1], '--hub-ring': t.hub[2] };
  for (const k in vars) s.setProperty(k, vars[k]);
  document.body.dataset.theme = cfg.theme;
  document.querySelector('meta[name=theme-color]').setAttribute('content', t.bg);
}
function applyAll() {
  applyTheme(); computeLayout(); renderFrame(); renderSectors(false); updateStatus();
}
function set(key, v) {
  if (spinning || cfg[key] === v) return;
  cfg[key] = v;
  if (key === 'after' || key === 'rng') { run.drawn = []; run.bag = []; }
  highlight.clear();
  applyAll();
  if (key === 'spinner') { homePose(); applyPose(); setSway(true); }
  syncSettings(); save();
}
function setList(text) {
  cfg.list = text;
  $('listTA').value = text;
  listChanged();
}
function listChanged() {
  parse(); highlight.clear(); computeLayout(); renderSectors(true); updateStatus(); updateListMeta(); save();
}

let listTimer = 0;
$('listTA').addEventListener('input', () => {
  clearTimeout(listTimer);
  listTimer = setTimeout(() => { cfg.list = $('listTA').value; listChanged(); }, 220);
});
$('titleInp').addEventListener('input', () => { cfg.title = $('titleInp').value.trim(); updateStatus(); save(); });
$('shuffleBtn').onclick = () => {
  const lines = $('listTA').value.split(/\r?\n/).filter(l => l.trim());
  for (let i = lines.length - 1; i > 0; i--) { const j = randInt(i + 1); [lines[i], lines[j]] = [lines[j], lines[i]]; }
  setList(lines.join('\n'));
};
$('dedupeBtn').onclick = () => { const seen = new Set(); setList(listText(items.filter(i => !seen.has(i.name) && seen.add(i.name)))); };
$('genBtn').onclick = () => {
  let a = Math.round(parseFloat($('genFrom').value)), b = Math.round(parseFloat($('genTo').value));
  if (!Number.isFinite(a) || !Number.isFinite(b)) return;
  if (a > b) [a, b] = [b, a];
  if (b - a > 999) b = a + 999;
  if (items.length && !confirm(`用 ${a} 到 ${b} 替换现在的名单？`)) return;
  const out = [];
  for (let i = a; i <= b; i++) out.push(String(i));
  setList(out.join('\n'));
};
$('histClear').onclick = () => { run.history = []; save(); renderHistoryList(); renderRecent(); };

const TABS = ['list', 'draw', 'look', 'history'];
function showTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.pane !== tab; });
  $('pBody').scrollTop = 0;
}
function route() {
  const tab = location.hash.slice(1);
  const open = TABS.includes(tab) && !spinning;
  drawer.classList.toggle('open', open);
  if (open) drawer.removeAttribute('inert'); else drawer.setAttribute('inert', '');
  $('app').toggleAttribute('inert', open);
  if (!open) return;
  showTab(tab);
  $('listTA').value = cfg.list; $('titleInp').value = cfg.title;
  syncSettings(); renderHistoryList();
}
function openDrawer(tab) { openedHere = true; location.hash = tab; }
function closeDrawer() {
  if (openedHere) { openedHere = false; history.back(); }
  else location.hash = '';
}
document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => { history.replaceState(null, '', '#' + b.dataset.tab); route(); }; });
addEventListener('hashchange', () => { if (!TABS.includes(location.hash.slice(1))) openedHere = false; route(); });
$('gearBtn').onclick = () => openDrawer(curTab === 'history' ? 'list' : curTab);
$('histBtn').onclick = () => openDrawer('history');
$('closeBtn').onclick = closeDrawer;
$('scrim').onclick = closeDrawer;

/* ---------- 操作 ---------- */
hub.onclick = spin;
dial.addEventListener('click', spin);
$('resetBtn').onclick = resetDraw;
document.addEventListener('keydown', e => {
  if (!$('modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (drawer.classList.contains('open')) { if (e.key === 'Escape') closeDrawer(); return; }
  if (e.key !== ' ' && e.key !== 'Enter') return;
  if (e.target.closest && e.target.closest('button,input,textarea,a')) return;
  e.preventDefault(); spin();
});
let rsTimer = 0, lastW = 0;
const onResize = () => {
  clearTimeout(rsTimer);
  rsTimer = setTimeout(() => { const w = Math.round(dial.getBoundingClientRect().width); if (w && w !== lastW && !spinning) { lastW = w; renderSectors(false); } }, 160);
};
if (window.ResizeObserver) new ResizeObserver(onResize).observe($('stage')); else addEventListener('resize', onResize);

load(); parse(); buildSettings(); applyAll(); homePose(); applyPose(); setSway(true); showLast(); renderRecent(); route();
lastW = Math.round(dial.getBoundingClientRect().width);
})();
</script>
</body>
